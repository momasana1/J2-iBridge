name: Build J2 iBridge Android 5 Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Generate Compatible Project Files
        run: |
          mkdir -p app/src/main/java/com/example/j2ibridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          keytool -genkey -v -keystore app/j2.keystore -alias j2key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=J2,O=Bridge,C=US"

          cat << 'EOF' > settings.gradle
          rootProject.name = "J2iBridge"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.j2ibridge'
              compileSdk 30
              defaultConfig {
                  applicationId "com.example.j2ibridge"
                  minSdk 21
                  targetSdk 22
                  versionCode 3
                  versionName "3.0"
              }
              signingConfigs {
                  j2sign {
                      storeFile file("j2.keystore")
                      storePassword "123456"
                      keyAlias "j2key"
                      keyPassword "123456"
                      v1SigningEnabled true
                      v2SigningEnabled false
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.j2sign
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
              implementation 'com.google.zxing:core:3.4.1'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/ussd_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:packageNames="com.android.phone"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="J2 iBridge"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".J2BridgeService" android:exported="false" />
                  <service
                      android:name=".UssdService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/ussd_config" />
                  </service>
                  <receiver android:name=".EventReceiver" android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.PHONE_STATE" />
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/client.html
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            <title>J2 iBridge</title>
            <style>
              :root { --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --sub:#8e8e93; }
              * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
              body { font-family:-apple-system,sans-serif; background:var(--bg); color:#fff; margin:0; padding:14px 14px 85px; }
              .top { display:flex; justify-content:space-between; align-items:center; background:var(--card); padding:12px 14px; border-radius:16px; margin-bottom:12px; font-size:13px; }
              .pill { padding:4px 10px; border-radius:99px; font-weight:600; font-size:12px; }
              .on { background:rgba(48,209,88,.2); color:var(--green); }
              .off { background:rgba(255,69,58,.2); color:var(--red); }
              .sims { display:flex; gap:8px; margin-bottom:12px; }
              .sim { flex:1; padding:10px; border-radius:12px; border:1px solid #3a3a3c; background:var(--card2); color:#fff; font-weight:600; }
              .sim.active { border-color:var(--blue); background:rgba(10,132,255,.2); color:var(--blue); }
              .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:12px; }
              .dial-box { width:100%; background:transparent; border:none; color:#fff; font-size:30px; font-weight:600; text-align:center; direction:ltr; margin:6px 0 14px; outline:none; }
              .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:290px; margin:0 auto 14px; direction:ltr; }
              .k { height:60px; border-radius:30px; background:var(--card2); border:none; color:#fff; font-size:24px; }
              .btn { width:100%; padding:14px; border-radius:14px; border:none; font-size:16px; font-weight:600; color:#fff; }
              .green { background:var(--green); color:#000; } .blue { background:var(--blue); }
              input.f, textarea.f { width:100%; background:var(--card2); border:none; border-radius:12px; padding:12px; color:#fff; font-size:15px; margin-bottom:10px; }
              .sms { background:var(--card2); border-radius:14px; padding:12px; margin-bottom:10px; }
              .otp { margin-top:8px; padding:6px 12px; background:rgba(10,132,255,.25); color:var(--blue); border:none; border-radius:8px; font-weight:600; }
              .tabs { position:fixed; bottom:0; left:0; right:0; background:rgba(28,28,30,.95); display:flex; border-top:1px solid #38383a; padding:10px 0 22px; }
              .tab { flex:1; background:none; border:none; color:var(--sub); font-size:13px; }
              .tab.active { color:var(--blue); font-weight:700; }
              .sec { display:none; } .sec.active { display:block; }
            </style>
          </head>
          <body>
            <div class="top">
              <div><span id="st" class="pill off">در حال اتصال...</span> <span id="bat" style="color:var(--sub);margin-right:6px;">باتری: --%</span></div>
              <span id="voiceSt" style="color:var(--sub);font-size:12px;">صدا: آماده</span>
            </div>
            <div id="simBar" class="sims"></div>
            <div id="t-dial" class="sec active">
              <div class="card">
                <input id="num" class="dial-box" type="tel" placeholder="شماره یا کد *100#" />
                <div class="pad">
                  <button class="k" onclick="add('1')">1</button><button class="k" onclick="add('2')">2</button><button class="k" onclick="add('3')">3</button>
                  <button class="k" onclick="add('4')">4</button><button class="k" onclick="add('5')">5</button><button class="k" onclick="add('6')">6</button>
                  <button class="k" onclick="add('7')">7</button><button class="k" onclick="add('8')">8</button><button class="k" onclick="add('9')">9</button>
                  <button class="k" onclick="add('*')">*</button><button class="k" onclick="add('0')">0</button><button class="k" onclick="add('#')">#</button>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn green" onclick="dial()">تماس / اجرای کد</button>
                  <button class="btn" style="background:var(--card2);width:76px;" onclick="del()">⌫</button>
                </div>
                <div id="ussdBox" style="display:none;margin-top:12px;background:var(--card2);padding:12px;border-radius:12px;font-size:14px;line-height:1.6;"></div>
              </div>
            </div>
            <div id="t-sms" class="sec">
              <div class="card">
                <input id="to" class="f" type="tel" placeholder="شماره گیرنده..." dir="ltr" />
                <textarea id="txt" class="f" rows="3" placeholder="متن پیامک فارسی..."></textarea>
                <button class="btn blue" onclick="sendSms()">ارسال پیامک</button>
              </div>
              <div id="smsList"></div>
            </div>
            <div class="tabs">
              <button class="tab active" onclick="tab('dial',this)">شماره‌گیر و USSD</button>
              <button class="tab" onclick="tab('sms',this)">پیامک‌ها</button>
            </div>
          <script>
            let ws, slot=0, subId=-1, sims=[];
            function tab(n,el){ document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('t-'+n).classList.add('active'); el.classList.add('active'); }
            function add(c){ document.getElementById('num').value+=c; }
            function del(){ const e=document.getElementById('num'); e.value=e.value.slice(0,-1); }
            function conn(){
              ws=new WebSocket(`ws://${location.host}/ws`);
              ws.onopen=()=>{ const s=document.getElementById('st'); s.innerText='متصل به J2'; s.className='pill on'; };
              ws.onclose=()=>{ const s=document.getElementById('st'); s.innerText='قطع شد'; s.className='pill off'; setTimeout(conn,2000); };
              ws.onmessage=(e)=>{
                const d=JSON.parse(e.data);
                if(d.type==='STATUS'){
                  document.getElementById('bat').innerText='باتری J2: '+d.battery+'%';
                  if(d.voiceReady) document.getElementById('voiceSt').innerText='مکالمه آیفون: متصل ✅';
                  sims=d.sims||[]; const b=document.getElementById('simBar'); b.innerHTML='';
                  sims.forEach((s,i)=>{ if(i===0){slot=s.slot;subId=s.subId;} const btn=document.createElement('button'); btn.className='sim'+(i===0?' active':''); btn.innerText='SIM '+(s.slot+1)+': '+s.carrier; btn.onclick=()=>{ document.querySelectorAll('.sim').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); slot=s.slot; subId=s.subId; ws.send(JSON.stringify({cmd:'SET_SIM',slot,subId})); }; b.appendChild(btn); });
                } else if(d.type==='USSD_RESULT'){
                  const u=document.getElementById('ussdBox'); u.style.display='block'; u.innerText=d.message;
                } else if(d.type==='SMS_LIST'){
                  document.getElementById('smsList').innerHTML=(d.items||[]).map(m=>{
                    const otp=m.smsType===1?(m.body.match(/\b\d{4,8}\b/)||[])[0]:null;
                    return `<div class="sms"><div style="display:flex;justify-content:space-between;color:var(--blue);font-size:13px;margin-bottom:6px;"><b>${m.name}</b><span>${m.smsType===1?'دریافتی':'ارسالی'}</span></div><div>${m.body}</div>${otp?`<button class="otp" onclick="navigator.clipboard.writeText('${otp}');this.innerText='کپی شد: ${otp}'">کپی کد: ${otp}</button>`:''}</div>`;
                  }).join('');
                }
              };
            }
            function dial(){ const n=document.getElementById('num').value.trim(); if(!n)return; if(n.startsWith('*')){const u=document.getElementById('ussdBox');u.style.display='block';u.innerText='در حال دریافت پاسخ...';} ws.send(JSON.stringify({cmd:'DIAL',number:n,slot,subId})); }
            function sendSms(){ const to=document.getElementById('to').value.trim(), text=document.getElementById('txt').value.trim(); if(!to||!text)return; ws.send(JSON.stringify({cmd:'SEND_SMS',to,text,subId})); document.getElementById('txt').value=''; }
            conn();
          </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/j2ibridge/LocalVoiceServer.kt
          package com.example.j2ibridge

          import android.content.Context
          import android.media.*
          import java.net.*
          import java.util.UUID
          import kotlin.concurrent.thread

          class LocalVoiceServer(
              private val context: Context,
              private val onDialRequest: (String) -> Unit,
              private val onAnswerRequest: () -> Unit,
              private val onHangupRequest: () -> Unit
          ) {
              private var sipSocket: DatagramSocket? = null
              private var rtpSocket: DatagramSocket? = null
              private var running = false

              var iphoneIp: InetAddress? = null
              private var iphoneSipPort = 5060
              private var remoteRtpIp: InetAddress? = null
              private var remoteRtpPort = 0

              private var isBridging = false
              private var callId = ""
              private var viaHeader = ""
              private var fromHeader = ""
              private var toHeader = ""
              private var callAnswered = false

              fun start() {
                  if (running) return
                  running = true
                  thread(start = true) {
                      try {
                          sipSocket = DatagramSocket(5060)
                          val buf = ByteArray(4096)
                          while (running) {
                              val pkt = DatagramPacket(buf, buf.size)
                              sipSocket?.receive(pkt)
                              val msg = String(pkt.data, 0, pkt.length, Charsets.UTF_8)
                              handleSipPacket(msg, pkt.address, pkt.port)
                          }
                      } catch (_: Exception) {}
                  }
              }

              fun stop() {
                  running = false
                  stopAudioBridge()
                  sipSocket?.close()
              }

              private fun sendSip(msg: String, ip: InetAddress, port: Int) {
                  try {
                      val bytes = msg.toByteArray(Charsets.UTF_8)
                      sipSocket?.send(DatagramPacket(bytes, bytes.size, ip, port))
                  } catch (_: Exception) {}
              }

              private fun extractHeader(lines: List<String>, name: String): String {
                  return lines.firstOrNull { it.startsWith("$name:", ignoreCase = true) }
                      ?.substringAfter(":")?.trim() ?: ""
              }

              private fun handleSipPacket(msg: String, srcIp: InetAddress, srcPort: Int) {
                  val lines = msg.split("\r\n", "\n")
                  val firstLine = lines.firstOrNull() ?: return

                  if (firstLine.startsWith("REGISTER ")) {
                      iphoneIp = srcIp
                      iphoneSipPort = srcPort
                      val via = extractHeader(lines, "Via")
                      val from = extractHeader(lines, "From")
                      val to = extractHeader(lines, "To")
                      val cid = extractHeader(lines, "Call-ID")
                      val cseq = extractHeader(lines, "CSeq")
                      val toTagged = if (to.contains("tag=")) to else "$to;tag=j2reg"
                      val resp = "SIP/2.0 200 OK\r\n" +
                              "Via: $via\r\nFrom: $from\r\nTo: $toTagged\r\n" +
                              "Call-ID: $cid\r\nCSeq: $cseq\r\n" +
                              "Contact: <sip:100@${srcIp.hostAddress}:$srcPort>;expires=3600\r\n" +
                              "Content-Length: 0\r\n\r\n"
                      sendSip(resp, srcIp, srcPort)
                  } else if (firstLine.startsWith("INVITE ")) {
                      iphoneIp = srcIp
                      iphoneSipPort = srcPort
                      viaHeader = extractHeader(lines, "Via")
                      fromHeader = extractHeader(lines, "From")
                      val rawTo = extractHeader(lines, "To")
                      toHeader = if (rawTo.contains("tag=")) rawTo else "$rawTo;tag=j2srv"
                      callId = extractHeader(lines, "Call-ID")
                      val cseq = extractHeader(lines, "CSeq")

                      val targetNum = firstLine.substringAfter("sip:").substringBefore("@")
                      parseSdp(msg, srcIp)

                      val sdp = buildSdp()
                      val ok = "SIP/2.0 200 OK\r\n" +
                              "Via: $viaHeader\r\nFrom: $fromHeader\r\nTo: $toHeader\r\n" +
                              "Call-ID: $callId\r\nCSeq: $cseq\r\n" +
                              "Contact: <sip:j2@192.168.44.1:5060>\r\n" +
                              "Content-Type: application/sdp\r\n" +
                              "Content-Length: ${sdp.toByteArray().size}\r\n\r\n$sdp"
                      sendSip(ok, srcIp, srcPort)
                      callAnswered = true
                      onDialRequest(targetNum)
                      startAudioBridge()
                  } else if (firstLine.startsWith("SIP/2.0 200 OK") && extractHeader(lines, "CSeq").contains("INVITE")) {
                      parseSdp(msg, srcIp)
                      toHeader = extractHeader(lines, "To")
                      val ack = "ACK sip:100@${srcIp.hostAddress}:$srcPort SIP/2.0\r\n" +
                              "Via: $viaHeader\r\nFrom: $fromHeader\r\nTo: $toHeader\r\n" +
                              "Call-ID: $callId\r\nCSeq: 1 ACK\r\nContent-Length: 0\r\n\r\n"
                      sendSip(ack, srcIp, srcPort)
                      callAnswered = true
                      onAnswerRequest()
                      startAudioBridge()
                  } else if (firstLine.startsWith("BYE ") || firstLine.startsWith("CANCEL ")) {
                      val via = extractHeader(lines, "Via")
                      val from = extractHeader(lines, "From")
                      val to = extractHeader(lines, "To")
                      val cid = extractHeader(lines, "Call-ID")
                      val cseq = extractHeader(lines, "CSeq")
                      val ok = "SIP/2.0 200 OK\r\nVia: $via\r\nFrom: $from\r\nTo: $to\r\nCall-ID: $cid\r\nCSeq: $cseq\r\nContent-Length: 0\r\n\r\n"
                      sendSip(ok, srcIp, srcPort)
                      stopAudioBridge()
                      onHangupRequest()
                  } else if (firstLine.startsWith("SIP/2.0 4") || firstLine.startsWith("SIP/2.0 6")) {
                      stopAudioBridge()
                      onHangupRequest()
                  }
              }

              fun ringIphone(callerNumber: String) {
                  val ip = iphoneIp ?: return
                  callAnswered = false
                  callId = UUID.randomUUID().toString()
                  viaHeader = "SIP/2.0/UDP 192.168.44.1:5060;branch=z9hG4bK${UUID.randomUUID().toString().take(8)}"
                  fromHeader = "\"$callerNumber\" <sip:$callerNumber@192.168.44.1>;tag=j2out"
                  toHeader = "<sip:100@${ip.hostAddress}:$iphoneSipPort>"
                  val sdp = buildSdp()
                  val invite = "INVITE sip:100@${ip.hostAddress}:$iphoneSipPort SIP/2.0\r\n" +
                          "Via: $viaHeader\r\nMax-Forwards: 70\r\n" +
                          "From: $fromHeader\r\nTo: $toHeader\r\n" +
                          "Call-ID: $callId\r\nCSeq: 1 INVITE\r\n" +
                          "Contact: <sip:j2@192.168.44.1:5060>\r\n" +
                          "Content-Type: application/sdp\r\n" +
                          "Content-Length: ${sdp.toByteArray().size}\r\n\r\n$sdp"
                  sendSip(invite, ip, iphoneSipPort)
              }

              fun hangupIphone() {
                  val ip = iphoneIp ?: return
                  if (callId.isBlank()) return
                  val method = if (callAnswered) "BYE" else "CANCEL"
                  val cseqNum = if (callAnswered) 2 else 1
                  val msg = "$method sip:100@${ip.hostAddress}:$iphoneSipPort SIP/2.0\r\n" +
                          "Via: $viaHeader\r\nFrom: $fromHeader\r\nTo: $toHeader\r\n" +
                          "Call-ID: $callId\r\nCSeq: $cseqNum $method\r\nContent-Length: 0\r\n\r\n"
                  sendSip(msg, ip, iphoneSipPort)
                  callId = ""
                  stopAudioBridge()
              }

              private fun parseSdp(msg: String, fallbackIp: InetAddress) {
                  remoteRtpIp = fallbackIp
                  for (line in msg.split("\r\n", "\n")) {
                      if (line.startsWith("c=IN IP4 ")) {
                          try { remoteRtpIp = InetAddress.getByName(line.removePrefix("c=IN IP4 ").trim()) } catch (_: Exception) {}
                      } else if (line.startsWith("m=audio ")) {
                          remoteRtpPort = line.removePrefix("m=audio ").substringBefore(" ").toIntOrNull() ?: 0
                      }
                  }
              }

              private fun buildSdp(): String {
                  return "v=0\r\n" +
                          "o=j2 1001 1001 IN IP4 192.168.44.1\r\n" +
                          "s=J2Call\r\n" +
                          "c=IN IP4 192.168.44.1\r\n" +
                          "t=0 0\r\n" +
                          "m=audio 10000 RTP/AVP 0 101\r\n" +
                          "a=rtpmap:0 PCMU/8000\r\n" +
                          "a=rtpmap:101 telephone-event/8000\r\n" +
                          "a=sendrecv\r\n"
              }

              private fun startAudioBridge() {
                  if (isBridging) return
                  isBridging = true

                  val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  @Suppress("DEPRECATION")
                  if (!am.isWiredHeadsetOn) {
                      am.isSpeakerphoneOn = true
                  }

                  val sampleRate = 8000
                  val minBuf = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)

                  try { rtpSocket = DatagramSocket(10000) } catch (_: Exception) {}

                  thread(start = true) {
                      val track = AudioTrack(
                          AudioManager.STREAM_VOICE_CALL,
                          sampleRate,
                          AudioFormat.CHANNEL_OUT_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          minBuf,
                          AudioTrack.MODE_STREAM
                      ).apply { play() }

                      val pktBuf = ByteArray(512)
                      while (isBridging) {
                          try {
                              val pkt = DatagramPacket(pktBuf, pktBuf.size)
                              rtpSocket?.receive(pkt)
                              if (pkt.length > 12) {
                                  val payloadLen = pkt.length - 12
                                  val pcmBytes = ByteArray(payloadLen * 2)
                                  for (i in 0 until payloadLen) {
                                      val s = ulawToLinear(pkt.data[12 + i])
                                      pcmBytes[i * 2] = (s.toInt() and 0xFF).toByte()
                                      pcmBytes[i * 2 + 1] = ((s.toInt() shr 8) and 0xFF).toByte()
                                  }
                                  track.write(pcmBytes, 0, pcmBytes.size)
                              }
                          } catch (_: Exception) {}
                      }
                      track.stop()
                      track.release()
                  }

                  thread(start = true) {
                      var rec = AudioRecord(MediaRecorder.AudioSource.VOICE_CALL, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minBuf)
                      if (rec.state != AudioRecord.STATE_INITIALIZED) {
                          rec = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minBuf)
                      }
                      if (rec.state != AudioRecord.STATE_INITIALIZED) {
                          rec = AudioRecord(MediaRecorder.AudioSource.MIC, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minBuf)
                      }

                      val pcmShorts = ShortArray(160)
                      val rtpPacket = ByteArray(172)
                      rtpPacket[0] = 0x80.toByte()
                      rtpPacket[1] = 0x00.toByte()
                      var seq = 1
                      var ts = 160

                      rec.startRecording()
                      while (isBridging) {
                          val read = rec.read(pcmShorts, 0, 160)
                          val dstIp = remoteRtpIp
                          val dstPort = remoteRtpPort
                          if (read == 160 && dstIp != null && dstPort > 0) {
                              rtpPacket[2] = ((seq shr 8) and 0xFF).toByte()
                              rtpPacket[3] = (seq and 0xFF).toByte()
                              rtpPacket[4] = ((ts shr 24) and 0xFF).toByte()
                              rtpPacket[5] = ((ts shr 16) and 0xFF).toByte()
                              rtpPacket[6] = ((ts shr 8) and 0xFF).toByte()
                              rtpPacket[7] = (ts and 0xFF).toByte()
                              for (i in 0 until 160) {
                                  rtpPacket[12 + i] = linearToUlaw(pcmShorts[i])
                              }
                              try {
                                  rtpSocket?.send(DatagramPacket(rtpPacket, 172, dstIp, dstPort))
                              } catch (_: Exception) {}
                              seq++
                              ts += 160
                          }
                      }
                      rec.stop()
                      rec.release()
                  }
              }

              fun stopAudioBridge() {
                  isBridging = false
                  rtpSocket?.close()
                  rtpSocket = null
                  val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.isSpeakerphoneOn = false
              }

              private fun linearToUlaw(sample: Short): Byte {
                  var s = sample.toInt()
                  val sign = (s shr 8) and 0x80
                  if (sign != 0) s = -s
                  if (s > 32635) s = 32635
                  s += 0x84
                  var exp = 7
                  var mask = 0x4000
                  while (exp > 0 && (s and mask) == 0) {
                      exp--
                      mask = mask shr 1
                  }
                  val mantissa = (s shr (exp + 3)) and 0x0F
                  return (sign or (exp shl 4) or mantissa).inv().toByte()
              }

              private fun ulawToLinear(ulawByte: Byte): Short {
                  val u = ulawByte.toInt().inv() and 0xFF
                  val sign = u and 0x80
                  val exp = (u shr 4) and 0x07
                  val mantissa = u and 0x0F
                  var sample = ((mantissa shl 3) + 0x84) shl exp
                  sample -= 0x84
                  return (if (sign != 0) -sample else sample).toShort()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/j2ibridge/J2BridgeService.kt
          package com.example.j2ibridge

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.net.Uri
          import android.os.*
          import android.provider.*
          import android.telephony.*
          import fi.iki.elonen.*
          import org.json.*
          import java.io.IOException
          import java.util.concurrent.CopyOnWriteArrayList

          @SuppressLint("MissingPermission")
          class J2BridgeService : Service() {
              companion object { var instance: J2BridgeService? = null }
              private var server: BridgeServer? = null
              var voiceServer: LocalVoiceServer? = null
              var activeSlot = 0
              var activeSubId = -1

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel("j2b", "J2 iBridge", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                      startForeground(1, Notification.Builder(this, "j2b").setContentTitle("J2 iBridge فعال است").setSmallIcon(android.R.drawable.stat_sys_data_bluetooth).build())
                  } else {
                      @Suppress("DEPRECATION")
                      startForeground(1, Notification.Builder(this).setContentTitle("J2 iBridge فعال است").setSmallIcon(android.R.drawable.stat_sys_data_bluetooth).build())
                  }

                  voiceServer = LocalVoiceServer(
                      context = this,
                      onDialRequest = { num -> dialJ2(num, activeSlot, activeSubId) },
                      onAnswerRequest = { callReflect("answerRingingCall") },
                      onHangupRequest = { callReflect("endCall") }
                  ).apply { start() }

                  server = BridgeServer(8080).apply { start(5000, false) }
              }

              fun broadcast(json: JSONObject) { server?.sendAll(json.toString()) }

              private inner class BridgeServer(port: Int) : NanoWSD(port) {
                  private val sockets = CopyOnWriteArrayList<ClientWS>()
                  fun sendAll(s: String) { sockets.forEach { try { if (it.isOpen) it.send(s) } catch (_: Exception) {} } }

                  override fun serveHttp(session: IHTTPSession): Response {
                      val html = assets.open("client.html").bufferedReader().use { it.readText() }
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html)
                  }

                  override fun openWebSocket(handshake: IHTTPSession): WebSocket = ClientWS(handshake)

                  private inner class ClientWS(h: IHTTPSession) : WebSocket(h) {
                      override fun onOpen() {
                          sockets.add(this)
                          send(getStatusJson().toString())
                          send(getSmsJson().toString())
                      }
                      override fun onClose(c: WebSocketFrame.CloseCode?, r: String?, rem: Boolean) { sockets.remove(this) }
                      override fun onMessage(m: WebSocketFrame) {
                          val j = JSONObject(m.textPayload)
                          when (j.optString("cmd")) {
                              "SET_SIM" -> {
                                  activeSlot = j.optInt("slot", 0)
                                  activeSubId = j.optInt("subId", -1)
                              }
                              "DIAL" -> {
                                  activeSlot = j.optInt("slot", 0)
                                  activeSubId = j.optInt("subId", -1)
                                  dialJ2(j.getString("number"), activeSlot, activeSubId)
                              }
                              "SEND_SMS" -> sendSmsJ2(j.getString("to"), j.getString("text"), j.optInt("subId", -1))
                          }
                      }
                      override fun onPong(p: WebSocketFrame) {}
                      override fun onException(e: IOException) { sockets.remove(this) }
                  }
              }

              private fun getStatusJson(): JSONObject {
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val sims = JSONArray()
                  SubscriptionManager.from(this).activeSubscriptionInfoList?.forEachIndexed { idx, it ->
                      if (idx == 0 && activeSubId == -1) {
                          activeSlot = it.simSlotIndex
                          activeSubId = it.subscriptionId
                      }
                      sims.put(JSONObject().apply {
                          put("slot", it.simSlotIndex)
                          put("subId", it.subscriptionId)
                          put("carrier", it.carrierName?.toString() ?: "SIM ${it.simSlotIndex + 1}")
                      })
                  }
                  return JSONObject().apply {
                      put("type", "STATUS")
                      put("battery", bat)
                      put("voiceReady", voiceServer?.iphoneIp != null)
                      put("sims", sims)
                  }
              }

              fun dialJ2(num: String, slot: Int, subId: Int) {
                  val i = Intent(Intent.ACTION_CALL, Uri.parse("tel:${Uri.encode(num)}")).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      putExtra("com.android.phone.force.slot", true)
                      putExtra("com.android.phone.extra.slot", slot)
                      putExtra("simSlot", slot)
                      if (subId != -1) putExtra("subscription", subId)
                  }
                  startActivity(i)
              }

              fun callReflect(method: String) {
                  try {
                      val tm = getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      val m = tm.javaClass.getDeclaredMethod("getITelephony").apply { isAccessible = true }
                      val itel = m.invoke(tm)
                      itel.javaClass.getDeclaredMethod(method).invoke(itel)
                  } catch (_: Exception) {}
              }

              private fun sendSmsJ2(to: String, text: String, subId: Int) {
                  @Suppress("DEPRECATION")
                  val sms = if (subId != -1) SmsManager.getSmsManagerForSubscriptionId(subId) else SmsManager.getDefault()
                  sms.sendMultipartTextMessage(to, null, sms.divideMessage(text), null, null)
                  Handler(Looper.getMainLooper()).postDelayed({ broadcast(getSmsJson()) }, 1500)
              }

              fun resolveName(num: String): String {
                  if (num.isBlank()) return "ناشناس"
                  val u = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(num))
                  contentResolver.query(u, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME), null, null, null)?.use {
                      if (it.moveToFirst()) return it.getString(0)
                  }
                  return num
              }

              fun getSmsJson(): JSONObject {
                  val arr = JSONArray()
                  contentResolver.query(Telephony.Sms.CONTENT_URI, arrayOf(Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.TYPE), null, null, "${Telephony.Sms.DATE} DESC")?.use { c ->
                      var n = 0
                      while (c.moveToNext() && n < 30) {
                          val a = c.getString(0) ?: ""
                          arr.put(JSONObject().apply { put("address", a); put("name", resolveName(a)); put("body", c.getString(1) ?: ""); put("smsType", c.getInt(2)) })
                          n++
                      }
                  }
                  return JSONObject().apply { put("type", "SMS_LIST"); put("items", arr) }
              }

              override fun onDestroy() {
                  voiceServer?.stop()
                  server?.stop()
                  super.onDestroy()
              }

              override fun onBind(i: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/j2ibridge/EventReceiver.kt
          package com.example.j2ibridge

          import android.content.*
          import android.provider.Telephony
          import android.telephony.TelephonyManager

          class EventReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val b = J2BridgeService.instance ?: return
                  if (intent.action == TelephonyManager.ACTION_PHONE_STATE_CHANGED) {
                      val st = intent.getStringExtra(TelephonyManager.EXTRA_STATE)
                      val num = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER) ?: "Unknown"
                      if (st == TelephonyManager.EXTRA_STATE_RINGING) {
                          b.voiceServer?.ringIphone(num)
                      } else if (st == TelephonyManager.EXTRA_STATE_IDLE) {
                          b.voiceServer?.hangupIphone()
                      }
                  } else if (intent.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      b.broadcast(b.getSmsJson())
                  }
              }
          }
          EOF

